name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/SplitBox.exe dist/SplitBox.exe
          Set-Content -Path dist/README.txt -Value "SplitBox v0.1.0 - Windows x64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplitBox-Windows-x64
          path: dist/
